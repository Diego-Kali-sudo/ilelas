# ILelas 🗿 — Versione web su GitHub Pages
# A ogni push su main pubblica l'app web su:
# https://diego-kali-sudo.github.io/ilelas
#
# FUNZIONA ANCHE SU iPHONE: apri l'URL in Safari → Condividi →
# "Aggiungi a Home" → icona come app vera!
#
# ⚠️ PRIMA VOLTA: su GitHub vai in Settings → Pages →
#    "Build and deployment" → Source: seleziona "GitHub Actions"
name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # avvio manuale dal tab "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /ilelas/

      - name: Carica l'artefatto pagine
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
